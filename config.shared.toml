# 共享配置（可提交）
# 仅放非敏感信息：全局时区、字段名映射、定时参数。

help_doc = """
工作日晚上定时发送次日餐食预约卡片，点击午餐/晚餐按钮切换预约状态。

可发送“卡片”获取当前预约窗口卡片，发送“请假”设置暂停自动预约，发送“付款码”获取付款码，发送“帮助”查看本帮助文档。
每月发送餐费账单时，机器人也会自动附带付款码。
"""

# 业务时区（表格日期解析、定时任务、统计口径统一按此时区）
timezone = "Asia/Shanghai"

[commands]
today_card_texts = ["订餐", "/eatbot today", "当日卡片", "卡片"]
leave_texts = ["请假"]
help_texts = ["帮助"]
payment_qr_texts = ["付款码"]
today_card_menu_event_keys = ["当日卡片"]
leave_menu_event_keys = ["请假"]
payment_qr_image_path = "assets/付款码.jpeg"

[features]
# 是否启用预约交互功能；false 会禁用预约卡片、手动取卡、旧卡片回调写入和请假功能，不影响付款码与月度餐费归档。
reservation_interactions_enabled = false

[field_names.user_config]
# 逻辑字段名 -> 表中真实字段名
display_name = "用餐人员名称"
user = "人员"
meal_preference = "餐食偏好"
lunch_price = "午餐单价"
dinner_price = "晚餐单价"
enabled = "启用"

[field_names.meal_schedule]
start_date = "开始日期"
end_date = "截止日期"
meals = "当日餐食包含"
remark = "备注"

[field_names.meal_record]
# 仅配置业务字段，不配置 ID 字段
date = "日期"
user = "用餐者"
meal_type = "餐食类型"
price = "价格"
reservation_status = "预约状态"

[field_names.stats_receivers]
user = "人员"

[field_names.meal_fee_archive]
user = "用餐者"
start_date = "开始日期"
end_date = "结束日期"
fee = "费用"
lunch_count = "午餐数"
dinner_count = "晚餐数"

[schedule]
# 每日发卡时间（HH:MM）
send_time = "19:10"
# 定时发卡是否发送次日卡片；false 表示发送当天卡片
send_cards_for_next_day = true
# 用户主动取卡的预约窗口切换点；早于该时间返回当天卡片，大于等于该时间返回次日卡片
card_request_cutover = "19:00"
# 午餐截止时间（HH:MM）
lunch_cutoff = "08:30"
# 午餐最小成团人数；截止后若预约人数小于该值，则自动取消本餐全部预约
lunch_min_reserved_count = 3
# 晚餐截止时间（HH:MM）
dinner_cutoff = "14:00"
# 晚餐最小成团人数；截止后若预约人数小于该值，则自动取消本餐全部预约
dinner_min_reserved_count = 3
# 统计发送偏移（HH:MM:SS），表示在截止时间后多久发送统计
send_stat_offset = "00:01:00"
# 每月归档日（1-31；若当月不存在则自动回退到当月最后一天）
fee_archive_day_of_month = 15
# 餐费归档任务每日检查时间（HH:MM）
fee_archive_time = "21:00"
# 用餐定时配置缓存 TTL（分钟）
schedule_cache_ttl_minutes = 30
